name: AI Daily Digest

on:
  schedule:
    # Run daily at UTC 00:00 (Beijing Time 08:00)
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      dry:
        description: "Dry run - don't actually send email"
        default: false
        type: boolean
      github_limit:
        description: "Number of GitHub repos to include"
        default: "5"
        type: string
      hf_models_limit:
        description: "Number of HF models to include"
        default: "5"
        type: string
      arxiv_limit:
        description: "Number of arXiv papers to include"
        default: "5"
        type: string
      to_email:
        description: "Override recipients (comma-separated). Leave empty to use the subscriber list"
        default: ""
        type: string

jobs:
  daily_digest:
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: false

    - name: Install dependencies
      run: |
        uv sync --no-cache --extra twitter --extra youtube

    - name: Load subscriber list from private repo
      env:
        # Prefer the SSH deploy key; fall back to a fine-grained PAT, then to
        # the TO_EMAIL secret.
        SUBSCRIBERS_REPO_SSH_KEY: ${{ secrets.SUBSCRIBERS_REPO_SSH_KEY }}
        SUBSCRIBERS_REPO_TOKEN: ${{ secrets.SUBSCRIBERS_REPO_TOKEN }}
      run: |
        # Subscribers live in the private repo RollingTheRock/ai-daily-digest-subscribers
        # (one email per line, '#' comments ignored).
        if [ -n "$SUBSCRIBERS_REPO_SSH_KEY" ]; then
          mkdir -p ~/.ssh
          printf '%s\n' "$SUBSCRIBERS_REPO_SSH_KEY" > ~/.ssh/subscribers_key
          chmod 600 ~/.ssh/subscribers_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null || true
          GIT_SSH_COMMAND="ssh -i ~/.ssh/subscribers_key -o IdentitiesOnly=yes" \
            git clone --depth 1 git@github.com:RollingTheRock/ai-daily-digest-subscribers.git subscribers-repo >/dev/null 2>&1
        elif [ -n "$SUBSCRIBERS_REPO_TOKEN" ]; then
          git clone --depth 1 "https://x-access-token:${SUBSCRIBERS_REPO_TOKEN}@github.com/RollingTheRock/ai-daily-digest-subscribers.git" subscribers-repo >/dev/null 2>&1
        fi

        if [ -d subscribers-repo ]; then
          EMAILS=$(grep -v '^\s*#' subscribers-repo/subscribers.txt | grep -v '^\s*$' | tr -d ' \r' | paste -sd, -)
          COUNT=$(printf '%s' "$EMAILS" | tr ',' '\n' | grep -c . || true)
          echo "Loaded ${COUNT:-0} subscribers from private repo"
          echo "TO_EMAIL=$EMAILS" >> "$GITHUB_ENV"
        else
          echo "Private repo not accessible - falling back to TO_EMAIL secret"
        fi

    - name: Run AI Daily Digest
      env:
        # LLM Configuration
        LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'deepseek' }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        DEEPSEEK_API_BASE: ${{ secrets.DEEPSEEK_API_BASE }}
        # Email Configuration - SMTP (QQ Mail, Gmail, etc.)
        SMTP_HOST: ${{ secrets.SMTP_HOST }}
        SMTP_PORT: ${{ secrets.SMTP_PORT }}
        SMTP_USER: ${{ secrets.SMTP_USER }}
        SMTP_PASS: ${{ secrets.SMTP_PASS }}
        FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
        # Fallback recipient list if the private subscribers repo is not configured
        TO_EMAIL_SECRET: ${{ secrets.TO_EMAIL }}
        # Alternative: SendGrid
        SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        # Firebase (for arXiv paper tracking)
        FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
        # Web integration for favorites/notes
        DIGEST_WEB_URL: ${{ secrets.DIGEST_WEB_URL }}
        SECRET_KEY: ${{ secrets.SECRET_KEY }}
        # Twitter/X API (new content source)
        TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
        TWITTER_MIN_LIKES: ${{ secrets.TWITTER_MIN_LIKES || '100' }}
        TWITTER_MAX_TWEETS_PER_USER: ${{ secrets.TWITTER_MAX_TWEETS_PER_USER || '5' }}
        # YouTube Data API (new content source)
        YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        YOUTUBE_MIN_VIEWS: ${{ secrets.YOUTUBE_MIN_VIEWS || '10000' }}
        YOUTUBE_MIN_DURATION_MINUTES: ${{ secrets.YOUTUBE_MIN_DURATION_MINUTES || '5' }}
        YOUTUBE_MAX_VIDEOS_PER_CHANNEL: ${{ secrets.YOUTUBE_MAX_VIDEOS_PER_CHANNEL || '3' }}
        # Content source selection
        CONTENT_SOURCES: ${{ secrets.CONTENT_SOURCES || 'arxiv,blog' }}
        # Notion Output (optional)
        NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        OUTPUT_NOTION: ${{ secrets.OUTPUT_NOTION || 'false' }}
        TO_EMAIL_OVERRIDE: ${{ inputs.to_email }}
      run: |
        # Recipient selection: explicit override > subscriber repo > TO_EMAIL secret
        if [ -n "$TO_EMAIL_OVERRIDE" ]; then
          export TO_EMAIL="$TO_EMAIL_OVERRIDE"
          echo "Using override recipients (not printed to public logs)"
        else
          export TO_EMAIL="${TO_EMAIL:-$TO_EMAIL_SECRET}"
        fi
        echo "Running AI Daily Digest..."
        echo "LLM Provider: $LLM_PROVIDER"

        # Build command arguments
        ARGS=""
        if [ "${{ inputs.dry }}" == "true" ]; then
          ARGS="$ARGS --dry"
        fi
        if [ "${{ inputs.github_limit }}" != "" ]; then
          ARGS="$ARGS --github-limit ${{ inputs.github_limit }}"
        fi
        if [ "${{ inputs.hf_models_limit }}" != "" ]; then
          ARGS="$ARGS --hf-models-limit ${{ inputs.hf_models_limit }}"
        fi
        if [ "${{ inputs.arxiv_limit }}" != "" ]; then
          ARGS="$ARGS --arxiv-limit ${{ inputs.arxiv_limit }}"
        fi

        echo "Running: uv run arxiv-sanity-bot daily-digest $ARGS"
        uv run arxiv-sanity-bot daily-digest $ARGS
