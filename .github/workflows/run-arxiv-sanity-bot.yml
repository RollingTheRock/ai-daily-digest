name: Run Arxiv Sanity Bot

on:
  # Schedule disabled: legacy Twitter bot (secrets TWITTER_ACCESS_TOKEN_SECRET /
  # FIREBASE_CREDENTIALS were never configured). Can still be run manually via
  # workflow_dispatch once the required secrets are set.
  workflow_dispatch:
    inputs:
      window_start:
        description: "Start of the window in hours. Ex. 168 means that the window starts 168 hours (1 week) ago"
        default: "168"
        type: "string"
      window_stop:
        description: "Stop of the window in hours. Ex. 0 means up to now"
        default: "0"
        type: "string"

jobs:
  run_arxiv_sanity_bot:
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Check out repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true

    - name: Install dependencies
      run: |
        uv sync --extra twitter --extra youtube

    - name: Run Arxiv Sanity Bot
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        # Twitter API (legacy OAuth for posting - different from Bearer Token for reading)
        TWITTER_CONSUMER_KEY: ${{ secrets.TWITTER_CONSUMER_KEY }}
        TWITTER_CONSUMER_SECRET: ${{ secrets.TWITTER_CONSUMER_SECRET }}
        TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
        TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
        # Twitter/X API v2 (new for content aggregation)
        TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
        # YouTube Data API
        YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        # Content source configuration
        CONTENT_SOURCES: ${{ secrets.CONTENT_SOURCES || 'arxiv,blog' }}
        FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
        # Time window in hours (defaults apply for scheduled runs without inputs)
        WINDOW_START: ${{ inputs.window_start || '168' }}
        WINDOW_STOP: ${{ inputs.window_stop || '0' }}
      run: |
        # Note: Bot always fetches 7 days from APIs, then filters by time window.
        # `bot` is the subcommand of the click group (see cli/arxiv_sanity_bot.py).
        echo "Using window: $WINDOW_START hours ago to $WINDOW_STOP hours ago"
        uv run arxiv-sanity-bot bot --window_start "$WINDOW_START" --window_stop "$WINDOW_STOP"

