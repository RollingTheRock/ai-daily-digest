name: Dump Subscribers (temporary diagnostic)

# TEMPORARY: one-off diagnostic to recover the subscriber list from the
# TO_EMAIL secret (GitHub secrets cannot be read back via the API).
# Delete this workflow after use.

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Write TO_EMAIL to artifact file
        env:
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: |
          printf '%s\n' "$TO_EMAIL" > subscribers.txt
          echo "bytes written: $(wc -c < subscribers.txt)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: subscribers
          path: subscribers.txt
          if-no-files-found: error
