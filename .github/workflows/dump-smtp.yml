name: Dump SMTP Config (temporary diagnostic)

# TEMPORARY: one-off diagnostic to test SMTP credentials from a local IP.
# Delete this workflow after use.

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest

    steps:
      - name: Write SMTP config to artifact file
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
        run: |
          printf 'HOST=%s\nPORT=%s\nUSER=%s\nPASS=%s\nFROM=%s\n' \
            "$SMTP_HOST" "$SMTP_PORT" "$SMTP_USER" "$SMTP_PASS" "$FROM_EMAIL" > smtp-config.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: smtp-config
          path: smtp-config.txt
          if-no-files-found: error
