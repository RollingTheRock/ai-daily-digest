name: Diag GitHub Trending (temporary)

# TEMPORARY: check what github.com/trending actually returns and why the
# scraper parses stars as 0. Delete after use.

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch trending page and analyze
        run: |
          curl -sL "https://github.com/trending?since=daily" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            -o trending.html
          echo "page bytes: $(wc -c < trending.html)"
          echo "=== repo names ==="
          grep -oE 'href="/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+"' trending.html | sort -u | head -20
          echo "=== star link classes (sample) ==="
          grep -oE 'class="Link[^"]*"' trending.html | sort | uniq -c | sort -rn | head -10
          echo "=== codex present? ==="
          grep -c "openai/codex" trending.html || true

      - name: Upload page
        uses: actions/upload-artifact@v4
        with:
          name: trending-page
          path: trending.html
          if-no-files-found: error
